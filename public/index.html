    <!-- Other half of the 404.html SPA redirect trick: restores the real
         URL (e.g. /projects) via pushState before React Router mounts,
         so direct links and refreshes on any route work on GitHub Pages. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
