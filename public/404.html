<!DOCTYPE html>
<!--
  GitHub Pages only serves the exact file requested — it has no server-side
  router, so a direct visit or refresh on a route like /projects 404s.
  This is the standard SPA workaround (rafgraph/spa-github-pages): GitHub
  Pages serves this file for any unknown path, and it redirects back to
  index.html while encoding the real path/query/hash into a query string
  that the script in index.html decodes and restores via pushState, before
  React Router ever sees it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Krishan Himesh</title>
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
